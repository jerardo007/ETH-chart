<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #191919;
      color-scheme: dark;
    }

    tv-mini-chart {
      display: block;
      width: 100%;
      height: 100vh;
      background: #191919;
    }
  </style>
</head>

<body>

  <script
    type="module"
    src="https://widgets.tradingview-widget.com/w/en/tv-mini-chart.js">
  </script>

  <tv-mini-chart
    symbol="COINBASE:ETHUSD"
    time-frame="7D"
    show-time-scale
    theme="dark"
    style="--tv-widget-background-color:#191919;">
  </tv-mini-chart>

</body>
</html>
